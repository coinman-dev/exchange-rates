org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP 2.2.10 (в комплекте AGP 9.4) регистрирует сгенерированные исходники через kotlin.sourceSets,
# что запрещено built-in Kotlin. Официальный флаг совместимости, см. developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
