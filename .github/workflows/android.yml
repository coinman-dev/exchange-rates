name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Раз в неделю проверяем, что источники курсов не сменили схему ответа.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # AGP 9.4 достаточно JDK 17, но Robolectric нужен JDK 21 для SDK 36+.
      # Ставим оба: тесты сами берут 21 через toolchain.
      - name: JDK 17 и 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Компоненты SDK
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # Живые API отключены флагом: сборка не должна падать из-за чужой недоступности.
      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest -PskipLiveTests

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Ключ подписи лежит в секретах репозитория (см. secrets/README.md). У запросов
      # из форков секретов нет: тогда релиз собирается неподписанным, сборка не падает.
      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — релизный APK будет без подписи"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Сборка APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # Без ключа Gradle молча выдаёт неподписанный APK, поэтому подпись проверяется явно.
      - name: Проверка подписи
        if: steps.keystore.outputs.path != ''
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14

  live-sources:
    name: Проверка живых источников курсов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Отдельная задача: падение означает, что источник сменил схему ответа,
    # а не что сломан код. Запускается по расписанию и вручную.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest --tests "*LiveSourcesIntegrationTest*"
