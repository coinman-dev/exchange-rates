name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Раз в неделю проверяем, что источники курсов не сменили схему ответа.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # AGP 9.4 достаточно JDK 17, но Robolectric нужен JDK 21 для SDK 36+.
      # Ставим оба: тесты сами берут 21 через toolchain.
      - name: JDK 17 и 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Компоненты SDK
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Живые API отключены флагом: сборка не должна падать из-за чужой недоступности.
      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest -PskipLiveTests

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Сборка APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14

  live-sources:
    name: Проверка живых источников курсов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Отдельная задача: падение означает, что источник сменил схему ответа,
    # а не что сломан код. Запускается по расписанию и вручную.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --tests "*LiveSourcesIntegrationTest*"
