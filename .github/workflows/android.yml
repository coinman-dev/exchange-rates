name: Android

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      live_sources:
        description: "Also contact the live exchange-rate providers"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # AGP 9.4 достаточно JDK 17, но Robolectric нужен JDK 21 для SDK 36+.
      # Ставим оба: тесты сами берут 21 через toolchain.
      - name: JDK 17 и 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Компоненты SDK
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # Живые API отключены флагом: сборка не должна падать из-за чужой недоступности.
      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest -PskipLiveTests

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 3

  live-sources:
    name: Проверка живых источников курсов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Отдельная задача: падение означает, что источник сменил схему ответа,
    # а не что сломан код. Запускается по расписанию и вручную.
    if: github.event_name == 'schedule' || inputs.live_sources

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest --tests "*LiveSourcesIntegrationTest*"
